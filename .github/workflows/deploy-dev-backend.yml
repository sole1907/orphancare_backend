name: Deploy Dev Backend

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
              const t = summary.total;
              const badge = (pct) => pct >= 90 ? '🟢' : pct >= 75 ? '🟡' : '🔴';

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Coverage Report\n| Metric | % | Status |\n|--------|---|--------|\n| Lines | ${t.lines.pct}% | ${badge(t.lines.pct)} |\n| Functions | ${t.functions.pct}% | ${badge(t.functions.pct)} |\n| Branches | ${t.branches.pct}% | ${badge(t.branches.pct)} |\n| Statements | ${t.statements.pct}% | ${badge(t.statements.pct)} |`
              });
            } catch (error) {
              console.log('Could not read coverage summary:', error.message);
            }

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies and build
        run: |
          npm ci
          rm -rf functions/lib
          npm run build

      - name: Deploy via NPM Script
        run: npm run deploy-dev
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PAYSTACK_URI: "https://api.paystack.co"
